<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background Container with rounded squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer metallic border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4" />

  <!-- Gear & Cogwheel Graphic for Automotive Parts -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Diamond Square Icon -->
    <rect x="-85" y="-85" width="170" height="170" rx="28" fill="none" stroke="#ffffff" stroke-width="22" transform="rotate(45)" />
    <!-- Inner Gold Core -->
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="url(#gold)" transform="rotate(45)" />
    <!-- Center Wrench / Spark Dot -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" />
  </g>
  
  <!-- Text Label "PS.ZA" -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    PARTSSOURCE<tspan fill="#38bdf8">.ZA</tspan>
  </text>
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    AUTO &amp; TRUCK SPARES
  </text>
</svg>
